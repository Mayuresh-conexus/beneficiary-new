<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>Field Connect — Beneficiary Management</title>
    <meta name="description" content="Field Connect volunteer mobile app for beneficiary management">
    <meta name="theme-color" content="#1e3b8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/mobile/manifest.json">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1e3b8a",
                        "primary-hover": "#152a61",
                        "primary-light": "#3b5998",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121620",
                    },
                    fontFamily: { "display": ["Public Sans", "sans-serif"] },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="/mobile/styles.css">
</head>

<body class="bg-background-light font-display text-slate-800 antialiased selection:bg-primary/30">
    <div id="app"></div>

    <!-- JS Modules (order matters) -->
    <script src="/mobile/api.js"></script>
    <script src="/mobile/screens.js"></script>
    <script src="/mobile/screens2.js"></script>
    <script src="/mobile/app.js"></script>
</body>

</html>
